  about:
    en: |
      I am pursuing an **M.Sc. in Electronic Engineering** at Yeungnam University, South Korea, supported by the [Global Korea Scholarship (GKS)](https://www.studyinkorea.go.kr/). My research interests include **computer vision, 6D object pose estimation, robotic grasping, and vision-language-action (VLA) models**. I am a member of the Advanced Visual Intelligence Lab (AVIL), supervised by [Prof. Sungho Kim](https://scholar.google.com/citations?user=3TptC38AAAAJ&hl=en).

      Before joining Yeungnam University, I earned my bachelor's degree in Electrical Engineering from [Muhammadiyah University of Yogyakarta](https://www.umy.ac.id/), Indonesia, graduating with honors. I also participated in a double-degree program in Computer Science and Information Engineering at [Asia University](https://www.asia.edu.tw/), Taiwan. During my undergraduate studies, I participated in several research projects related to robotics, computer vision, and AI, and received awards in robotics competitions and research presentations.
    ko: |
      대한민국 정부초청장학생(GKS)으로 영남대학교 전자공학과에서 **석사 과정**을 밟고 있습니다. 연구 분야는 **컴퓨터 비전, 6D 물체 자세 추정, 로봇 파지, 비전-언어-행동(VLA) 모델**입니다. 지능형시각정보처리연구실(AVIL) 소속으로 [김성호 교수님](https://scholar.google.com/citations?user=3TptC38AAAAJ&hl=en)의 지도를 받고 있습니다.

      영남대학교 입학 전에는 인도네시아 무함마디야 욕야카르타 대학교(UMY)에서 전기공학 학사 학위를 우등으로 취득하였으며, 대만 아시아 대학교(Asia University)와의 컴퓨터과학 및 정보공학 복수학위 프로그램을 이수했습니다. 학부 재학 중 로보틱스, 컴퓨터 비전, 인공지능 관련 다수의 연구 프로젝트에 참여하였으며, 로봇 경진대회 및 학술 발표에서 다수의 상을 수상했습니다.

