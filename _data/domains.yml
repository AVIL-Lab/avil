# Research domains on the home page explorer ("One lab, many spectral bands").
# Each domain lists its members explicitly and splits into sensor sub-segments.
#
# Papers are matched by keyword: a paper belongs to a sub-segment when its title
# matches the domain's words/acronyms AND the sub-segment's words/acronyms
# (words: case-insensitive; acronyms: case-sensitive). A sub-segment's members
# are the current members who co-authored those papers, plus domain members
# whose listed research areas match the sub-segment.
#
#   members          names exactly as in members.yml
#   core_team        replaces `members` with a named core team. Names found in
#                    members.yml get their photo and card link; any other name is
#                    shown as a name-only chip. Sensor sub-segments then list only
#                    core-team members.
#   team_heading     "core" shows the heading "Core Team" for a `members` list
#                    without restricting the sensor tabs (default heading: Members)
#   funders          substrings of projects.yml `funder` that mark a project as
#                    belonging to the domain (projects also match by keyword)
#   equipment        equipment.yml categories; equipment_names picks single items
#   (sensor) members names listed for that sensor tab, replacing the automatic
#                    list built from co-authors and research areas
#   match_venue      also test the domain keywords against the venue (e.g. a paper
#                    at the Korea Institute of Military Science and Technology
#                    conference counts as defense work)

