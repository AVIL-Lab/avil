# Lab-wide text and contact details, taken from the lab's Wix site (2026-10-17).
# Every bilingual block has `en` and `ko`; the language switch in the header
# chooses which one is shown. Korean is the original Wix wording.

name: Advanced Visual Intelligence Lab
name_ko: 지능형시각정보처리연구실
short: AVIL
tagline: Deep Learning & Sensing
department: Department of Electronic Engineering
department_ko: 영남대학교 전자공학과
university: Yeungnam University
university_url: https://www.yu.ac.kr

about:
  en: >-
    The Advanced Visual Intelligence Lab (AVIL) is a research lab in the Department of
    Electronic Engineering at Yeungnam University working on computer vision and deep
    learning. Our research covers computer vision, deep learning and sensor fusion (EO,
    IR, SAR, Radar, HSI, Raman, RGB-D and more), applied to intelligent surveillance,
    AR/VR, automatic target detection and recognition, and healthcare in the defense and
    medical domains.
  ko: >-
    지능형시각정보처리연구실(AVIL)은 컴퓨터비전 및 딥러닝 분야를 연구하는 영남대학교 전자공학과
    연구실이다. 연구 분야는 컴퓨터 비전 및 딥러닝과 센서 융합(EO, IR, SAR, 레이더, HSI, 라만, RGB-D 등)이며
    이는 국방 및 의료 분야에서 지능형 감시, AR/VR, 자동표적탐지/인식, 헬스케어 등에 응용하고 있다.

purpose:
  en: >-
    We advance human-level visual and physical intelligence through computer vision,
    deep learning, and multimodal sensor fusion across EO, IR, HSI, SAR, Polarization,
    Radar, LiDAR, Raman, and RGB-D, developing physics-grounded scene interpretation,
    remote perception, vision-language-action (VLA) models, world models, and agentic
    robotics for defense, healthcare, and autonomous physical agents.
  ko: >-
    컴퓨터 비전, 딥러닝, 그리고 다중모달 물리 센싱 융합(EO, IR, HSI, SAR, 편광, 레이더,
    라이다, 라만, RGB-D)을 통해 인간 수준의 시각 및 피지컬 지능을 구현하며, 물리 기반 장면
    해석과 원격 객체 인지부터 비전-언어-행동(VLA) 모델, 월드 모델, 에이전틱 로보틱스에
    이르기까지 국방, 헬스케어, 자율 물리 에이전트를 위한 지능형 시스템을 연구합니다.

