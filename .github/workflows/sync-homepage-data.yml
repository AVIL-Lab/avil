name: Sync deadlines and journals from s-elim.github.io

# The AI conference deadline and Q1 journal pages read _data/conferences.yml and
# _data/journals.yml, which are maintained on Selim Sarowar's homepage. This job
# copies the current versions once a day and commits only when they changed.

on:
  schedule:
    - cron: "30 19 * * *"   # 04:30 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download data files
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/s-elim/s-elim.github.io/master/_data
          for f in conferences journals; do
            curl -fsSL --retry 3 "$base/$f.yml" -o "/tmp/$f.yml"
            # Refuse to overwrite with anything that is not a list of entries.
            n=$(grep -c '^- name:' "/tmp/$f.yml" || true)
            if [ "$n" -lt 10 ]; then echo "unexpected content in $f.yml ($n entries)"; exit 1; fi
            if command -v ruby >/dev/null; then ruby -ryaml -e 'abort("bad YAML") unless YAML.load_file(ARGV[0]).is_a?(Array)' "/tmp/$f.yml"; fi
            cp "/tmp/$f.yml" "_data/$f.yml"
          done

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain _data/conferences.yml _data/journals.yml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add _data/conferences.yml _data/journals.yml
            git commit -m "chore(data): sync deadlines and journals from s-elim.github.io"
            git push
          else
            echo "No changes."
          fi
