<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b1f33">
{% seo %}
<link rel="icon" href="{{ '/assets/img/brand/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/assets/img/brand/apple-touch-icon.png' | relative_url }}">
<script>
  // Theme and language are applied before first paint so the page never flashes.
  (function () {
    var d = document.documentElement, s = null, l = null;
    try { s = localStorage.getItem("avil-theme"); l = localStorage.getItem("avil-lang"); } catch (e) {}
    if (s === "dark" || s === "light") d.setAttribute("data-theme", s);
    if (l === "ko" || l === "en") { d.setAttribute("data-lang", l); d.setAttribute("lang", l); }
  })();
</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
{%- comment -%} ?v=<build time> makes browsers fetch fresh CSS/JS after every deploy. {%- endcomment -%}
{%- assign v = site.time | date: "%s" -%}
<link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}?v={{ v }}">
{%- for c in page.css %}
<link rel="stylesheet" href="{{ '/assets/css/' | append: c | append: '.css' | relative_url }}?v={{ v }}">
{%- endfor %}
